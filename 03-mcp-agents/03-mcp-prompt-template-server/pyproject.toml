[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ag103-mcp-prompt-template-server"
version = "0.1.0"
description = "Parameterized prompt templates exposed through MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.9,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
