[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-server-deployment-template"
version = "0.1.0"
description = "Hardened container starter for an MCP stdio server"
requires-python = ">=3.11"
dependencies = ["mcp>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
