[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-multi-tenant-isolation-demo"
version = "0.1.0"
description = "Fail-closed tenant-scoped data access demo"
requires-python = ">=3.11"
dependencies = ["mcp>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
