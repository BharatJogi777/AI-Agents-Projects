[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ag104-mcp-client-tool-discovery"
version = "0.1.0"
description = "Policy-aware discovery and normalization of MCP tools"
requires-python = ">=3.11"
dependencies = ["mcp>=1.9,<2", "pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
