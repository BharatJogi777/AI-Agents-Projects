[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "34kubernetesreadonlymcpserver"
version = "0.1.0"
description = "Kubernetes read-only MCP server"
requires-python = ">=3.11"
dependencies = ["mcp>=1.2", "kubernetes>=31.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
