[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "interactive-study-coach"
version = "0.1.0"
description = "Run a small evidence-based study session from learner-supplied questions, track answers, and schedule spaced reviews."
requires-python = ">=3.10"
[project.optional-dependencies]
dev = ["pytest>=8.0"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
