[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "17-product-discovery-interview-synthesizer"
version = "0.1.0"
description = "Synthesize supplied customer interview notes into themes, evidence snippets, and open questions."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
