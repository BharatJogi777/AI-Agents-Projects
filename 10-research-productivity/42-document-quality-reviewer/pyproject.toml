[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "document-quality-reviewer"
version = "0.1.0"
description = "Review supplied text for configurable structural quality checks and return actionable findings without rewriting content."
requires-python = ">=3.10"
[project.optional-dependencies]
dev = ["pytest>=8.0"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
