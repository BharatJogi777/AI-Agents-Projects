[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "proposal-drafting-assistant"
version = "0.1.0"
description = "Assemble a proposal outline from user-approved project facts, scope, deliverables, milestones, and assumptions."
requires-python = ">=3.10"
[project.optional-dependencies]
dev = ["pytest>=8.0"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
