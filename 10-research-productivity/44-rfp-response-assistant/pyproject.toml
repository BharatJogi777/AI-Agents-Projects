[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "rfp-response-assistant"
version = "0.1.0"
description = "Map supplied RFP questions to approved evidence, identify unanswered requirements, and flag responses needing subject-matter review."
requires-python = ">=3.10"
[project.optional-dependencies]
dev = ["pytest>=8.0"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
