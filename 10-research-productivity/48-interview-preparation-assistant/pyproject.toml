[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "interview-preparation-assistant"
version = "0.1.0"
description = "Build a role-specific interview practice plan from supplied competencies, experience examples, and target interview date."
requires-python = ">=3.10"
[project.optional-dependencies]
dev = ["pytest>=8.0"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
