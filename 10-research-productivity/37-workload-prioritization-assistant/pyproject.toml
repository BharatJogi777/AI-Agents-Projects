[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workload-prioritization-assistant"
version = "0.1.0"
description = "Rank tasks transparently using urgency, impact, effort, and blocking status while preserving the reasons for each score."
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
