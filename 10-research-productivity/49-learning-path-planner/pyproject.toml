[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "learning-path-planner"
version = "0.1.0"
description = "Order learning topics by explicit prerequisites and generate a dependency-safe sequence with estimated effort."
requires-python = ">=3.10"
[project.optional-dependencies]
dev = ["pytest>=8.0"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
