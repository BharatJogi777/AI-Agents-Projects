[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "job-search-research-assistant"
version = "0.1.0"
description = "Organize a supplied list of target employers and role leads, deduplicate entries, and preserve source provenance and follow-up status."
requires-python = ">=3.10"
[project.optional-dependencies]
dev = ["pytest>=8.0"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
