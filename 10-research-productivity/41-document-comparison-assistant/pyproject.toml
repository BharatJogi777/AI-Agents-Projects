[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "document-comparison-assistant"
version = "0.1.0"
description = "Compare two supplied document versions by normalized lines and report additions, removals, and unchanged content."
requires-python = ">=3.10"
[project.optional-dependencies]
dev = ["pytest>=8.0"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
