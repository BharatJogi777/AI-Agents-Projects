[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "grant-opportunity-finder"
version = "0.1.0"
description = "Filter a supplied grant catalogue by eligibility, topic, funding range, and deadline; never imply external listings are current."
requires-python = ">=3.10"
[project.optional-dependencies]
dev = ["pytest>=8.0"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
