[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-plan-decomposition-agent"
version = "0.1.0"
description = "Break a project goal into ordered, dependency-aware tasks with explicit owners, estimates, and acceptance criteria."
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
