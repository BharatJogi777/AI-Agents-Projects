[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "06-incident-severity-classifier"
version = "0.1.0"
description = "Classify incident severity from explicit impact, scope, and duration signals with an explainable scoring rubric."
requires-python = ">=3.10"
dependencies = []
[project.optional-dependencies]
dev = ["pytest>=8.0"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
