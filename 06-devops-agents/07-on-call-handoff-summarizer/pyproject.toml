[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "07-on-call-handoff-summarizer"
version = "0.1.0"
description = "Turn incident updates into a concise chronological handoff with unresolved actions and ownership."
requires-python = ">=3.10"
dependencies = []
[project.optional-dependencies]
dev = ["pytest>=8.0"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
