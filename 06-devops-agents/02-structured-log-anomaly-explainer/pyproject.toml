[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "02-structured-log-anomaly-explainer"
version = "0.1.0"
description = "Summarize structured JSON logs and flag unusual error-rate or severity changes against an explicit baseline."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
