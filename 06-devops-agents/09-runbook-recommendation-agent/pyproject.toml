[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "09-runbook-recommendation-agent"
version = "0.1.0"
description = "Recommend runbook actions by matching observed symptoms to explicitly tagged procedures without executing them."
requires-python = ">=3.10"
dependencies = []
[project.optional-dependencies]
dev = ["pytest>=8.0"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
