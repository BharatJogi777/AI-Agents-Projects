[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "04-metrics-query-assistant"
version = "0.1.0"
description = "Build validated PromQL templates from a narrow metric catalog instead of accepting arbitrary model-generated query text."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
