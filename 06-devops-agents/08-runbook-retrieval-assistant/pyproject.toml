[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "08-runbook-retrieval-assistant"
version = "0.1.0"
description = "Retrieve relevant runbook sections using transparent lexical matching and preserve exact document references."
requires-python = ">=3.10"
dependencies = []
[project.optional-dependencies]
dev = ["pytest>=8.0"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
