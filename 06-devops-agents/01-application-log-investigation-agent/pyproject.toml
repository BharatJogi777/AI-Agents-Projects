[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "01-application-log-investigation-agent"
version = "0.1.0"
description = "Parse bounded application logs, group recurring error signatures, and surface time-ordered evidence."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
