[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "23-event-triggered-inbox-agent"
version = "0.1.0"
description = "Deduplicate inbound message events and produce cautious triage recommendations without sending, deleting, or forwarding messages."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
