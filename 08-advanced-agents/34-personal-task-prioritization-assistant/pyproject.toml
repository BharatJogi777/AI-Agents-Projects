[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "34-personal-task-prioritization-assistant"
version = "0.1.0"
description = "Rank tasks using explicit user-provided urgency, impact, effort, and due-date signals with explainable scoring."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
