[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "22-audio-video-meeting-assistant"
version = "0.1.0"
description = "Synchronize independently supplied transcript, audio, and video markers on a shared timeline while surfacing gaps and conflicts."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
