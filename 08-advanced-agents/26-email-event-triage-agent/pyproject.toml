[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "26-email-event-triage-agent"
version = "0.1.0"
description = "Normalize inbound email events, detect duplicate message identifiers, and prioritize review without modifying a mailbox."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
