[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "28-long-running-workflow-monitor"
version = "0.1.0"
description = "Evaluate workflow execution snapshots for stalled steps, timeout conditions, and state regressions without controlling the workflow engine."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
