[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "29-background-task-progress-reporter"
version = "0.1.0"
description = "Aggregate task progress from validated milestones and expose stalled or failed work with explicit progress semantics."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
