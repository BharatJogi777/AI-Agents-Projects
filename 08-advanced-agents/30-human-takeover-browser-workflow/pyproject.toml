[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "30-human-takeover-browser-workflow"
version = "0.1.0"
description = "Model safe handoff between automation and a human operator with pause, resume, approval, and audit-event validation."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
