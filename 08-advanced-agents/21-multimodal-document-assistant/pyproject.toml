[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "21-multimodal-document-assistant"
version = "0.1.0"
description = "Validate and assemble text, image, audio, and tabular document parts into a provenance-preserving review package."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
