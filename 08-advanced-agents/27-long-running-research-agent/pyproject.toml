[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "27-long-running-research-agent"
version = "0.1.0"
description = "Represent a multi-step research run as resumable, checkpointed tasks with explicit evidence references and completion criteria."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
