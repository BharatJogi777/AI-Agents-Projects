[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "35-daily-briefing-agent"
version = "0.1.0"
description = "Assemble a concise daily briefing from explicitly supplied calendar, task, and update items while retaining source attribution."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
