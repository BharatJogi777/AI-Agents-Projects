[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "31-agent-session-handoff-manager"
version = "0.1.0"
description = "Create a portable, validated handoff packet containing task state, constraints, decisions, and pending work."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
