[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "24-scheduled-report-generation-agent"
version = "0.1.0"
description = "Evaluate explicit UTC report schedules and produce due-run decisions with idempotency keys; leave generation and delivery to an authorized worker."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
