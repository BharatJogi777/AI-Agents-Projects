[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "agent-project-58"
version = "0.1.0"
description = "Multi-format document ingester"
requires-python = ">=3.12"
dependencies = ["pypdf>=4.2", "python-docx>=1.1", "openpyxl>=3.1"]
[project.optional-dependencies]
dev = ["pytest>=8"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
