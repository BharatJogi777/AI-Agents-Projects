[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "46-ci-log-diagnosis-assistant"
version = "0.1.0"
description = "Classify common CI failures from bounded build logs and return evidence-backed findings with safe next steps."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
