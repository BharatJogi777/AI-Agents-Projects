[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "48-code-ownership-routing-agent"
version = "0.1.0"
description = "Resolve changed paths to CODEOWNERS-like owners with deterministic most-specific matching."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
