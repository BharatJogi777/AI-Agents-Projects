[build-system]
requires=["setuptools>=69","wheel"]
build-backend="setuptools.build_meta"
[project]
name="openai-compatible-api-adapter"
version="0.1.0"
requires-python=">=3.12"
dependencies=["httpx>=0.27,<1"]
[project.optional-dependencies]
dev=["pytest>=8,<9"]
[tool.pytest.ini_options]
testpaths=["tests"]
pythonpath=["."]
addopts="-q"
