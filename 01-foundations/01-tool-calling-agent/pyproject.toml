[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-calling-agent"
version = "0.1.0"
description = "A bounded, testable tool-calling agent using Ollama's OpenAI-compatible API"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
