[build-system]
requires=["setuptools>=69","wheel"]
build-backend="setuptools.build_meta"
[project]
name="tool-argument-validation-agent"
version="0.1.0"
requires-python=">=3.12"
dependencies=["pydantic>=2.7,<3"]
[project.optional-dependencies]
dev=["pytest>=8,<9"]
[tool.pytest.ini_options]
testpaths=["tests"]
pythonpath=["."]
addopts="-q"
